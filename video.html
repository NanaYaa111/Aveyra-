<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Generator</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .video-layout {
      display: flex;
      height: 100vh;
      background: #f5f4f0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .video-sidebar {
      width: 260px;
      background: #1e1e2e;
      color: #cdd6f4;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 16px;
    }

    .video-sidebar h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #cba6f7;
      letter-spacing: 0.05em;
    }

    .nav-link {
      display: block;
      color: #6c7086;
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background 0.1s, color 0.1s;
    }
    .nav-link:hover { background: #313244; color: #cdd6f4; }
    .nav-link.active { background: #45475a; color: #cba6f7; }

    .api-section label {
      display: block;
      font-size: 0.75rem;
      color: #6c7086;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .api-section input {
      width: 100%;
      background: #313244;
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      color: #cdd6f4;
      font-size: 0.82rem;
      outline: none;
      font-family: monospace;
    }
    .api-section input:focus { box-shadow: 0 0 0 2px #cba6f7; }

    .api-hint {
      font-size: 0.72rem;
      color: #6c7086;
      margin-top: 6px;
      line-height: 1.5;
    }
    .api-hint a { color: #cba6f7; }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 32px 40px;
      gap: 24px;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1c1b1a;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      border: 1px solid #e5e3df;
      padding: 24px;
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #1c1b1a;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #555;
    }

    .form-group textarea,
    .form-group input,
    .form-group select {
      border: 1px solid #e5e3df;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: inherit;
      color: #1c1b1a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fafaf9;
    }
    .form-group textarea:focus,
    .form-group input:focus,
    .form-group select:focus {
      border-color: #cba6f7;
      box-shadow: 0 0 0 3px rgba(203,166,247,0.15);
    }

    .form-group textarea { resize: vertical; min-height: 90px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .generate-btn {
      background: #cba6f7;
      color: #1e1e2e;
      border: none;
      border-radius: 8px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .generate-btn:hover { opacity: 0.85; }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-box {
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 0.88rem;
      display: none;
    }
    .status-box.info { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; }
    .status-box.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .status-box.error { background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; }
    .status-box.show { display: block; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #1e1e2e;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-area {
      display: none;
    }
    .result-area.show { display: block; }

    .result-area video {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      background: #1e1e2e;
      color: #cba6f7;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .download-btn:hover { opacity: 0.8; }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #e5e3df;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
      transition: background 0.1s;
    }
    .history-item:hover { background: #fafaf9; }

    .history-item .hi-prompt {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1c1b1a;
    }

    .history-item .hi-status {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .hi-status.pending { background: #fef9c3; color: #854d0e; }
    .hi-status.succeeded { background: #dcfce7; color: #15803d; }
    .hi-status.failed { background: #ffe4e6; color: #be123c; }

    .progress-bar-wrap {
      height: 4px;
      background: #e5e3df;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar {
      height: 100%;
      background: #cba6f7;
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    @media (max-width: 700px) {
      .main-area { padding: 20px 16px; }
      .form-row { grid-template-columns: 1fr; }
      .video-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div class="video-layout">
    <!-- Sidebar -->
    <aside class="video-sidebar">
      <h1>Journal</h1>
      <a href="index.html" class="nav-link">Entries</a>
      <a href="video.html" class="nav-link active">AI Video</a>

      <div class="api-section" style="margin-top: auto;">
        <label>Runway API Key</label>
        <input id="api-key-input" type="password" placeholder="rw-xxxxxxxxxxxxxxxx" />
        <p class="api-hint">
          Get a free key at <a href="https://app.runwayml.com" target="_blank">app.runwayml.com</a>.
          Stored only in your browser.
        </p>
      </div>
    </aside>

    <!-- Main -->
    <main class="main-area">
      <h1 class="page-title">AI Video Generator</h1>

      <!-- Generation form -->
      <div class="card">
        <h2>Generate a video</h2>

        <div class="form-group">
          <label for="prompt-input">Prompt</label>
          <textarea id="prompt-input" placeholder="A cinematic drone shot over golden wheat fields at sunset, slow pan, 4K…"></textarea>
        </div>

        <div class="form-group">
          <label for="negative-input">Negative prompt (optional)</label>
          <input id="negative-input" type="text" placeholder="blurry, low quality, text, watermark" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="duration-select">Duration</label>
            <select id="duration-select">
              <option value="5">5 seconds</option>
              <option value="10" selected>10 seconds</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ratio-select">Aspect ratio</label>
            <select id="ratio-select">
              <option value="1280:720" selected>16:9 Landscape</option>
              <option value="720:1280">9:16 Portrait</option>
              <option value="1104:832">4:3</option>
              <option value="832:1104">3:4</option>
              <option value="960:960">1:1 Square</option>
            </select>
          </div>
        </div>

        <button class="generate-btn" id="generate-btn">
          <span id="btn-icon">&#9654;</span>
          <span id="btn-label">Generate Video</span>
        </button>

        <div id="status-box" class="status-box" style="margin-top:14px;"></div>
        <div class="progress-bar-wrap" style="margin-top:10px; display:none;" id="progress-wrap">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>

      <!-- Result -->
      <div class="card result-area" id="result-area">
        <h2>Result</h2>
        <video id="result-video" controls playsinline></video>
        <br/>
        <a id="download-link" class="download-btn" download="ai-video.mp4">
          &#8595; Download MP4
        </a>
      </div>

      <!-- History -->
      <div class="card" id="history-card" style="display:none;">
        <h2>Generation history</h2>
        <div class="history-list" id="history-list"></div>
      </div>
    </main>
  </div>

  <script src="video.js"></script>
</body>
</html>
