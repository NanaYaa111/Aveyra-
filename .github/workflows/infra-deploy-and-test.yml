name: Apply infra & run integration

on:
  workflow_dispatch: {}

jobs:
  apply-sql:
    name: Apply SQL (manual)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Show files
        run: ls -la infra/supabase
      - name: Apply SQL schema and policies
        run: |
          chmod +x scripts/apply-sql.sh
          ./scripts/apply-sql.sh
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}

  integration-tests:
    name: Integration tests (supabase)
    runs-on: ubuntu-latest
    needs: apply-sql
    if: always()
    env:
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate RLS via anon client
        run: node scripts/validate-rls.js
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      - name: Run integration tests (Vitest)
        run: pnpm test -- -t supabase
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
